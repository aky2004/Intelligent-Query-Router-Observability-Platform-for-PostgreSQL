# Render Infrastructure-as-Code blueprint for pg-router-ai
services:
  - type: web
    name: pg-router-ai-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: virginia
    healthCheckPath: /docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PG_PROXY_PORT
        value: 5433
      - key: SIMULATE_DB
        value: "false"
      - key: AUTH_DISABLED
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BEDROCK_MODEL_ID
        value: deepseek.v3.2
      - key: FIREBASE_PROJECT_ID
        value: pgpooler
